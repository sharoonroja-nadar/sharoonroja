<!DOCTYPE html>
<html>
<head>
    <title>Festival Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #fff8e1;
        }

        .header {
            background-color:orange;
            color: white;
            text-align: center;
            padding: 15px;
            height: 100px;
        }

        .logo {
            float: left;
            margin-left: 20px;
        }

        .logo img {
            width: 130px;
            height: 120px;
            object-fit: contain;
        }

        .header h1 {
            margin: 10px;
        }

        .header p {
            margin: 5px;
        }

        .nav {
            background-color: #333;
            text-align: center;
            padding: 15px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }


        .contact {
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border: 2px solid orange;
            text-align: center;
        }

        .contact h2 {
            color: #e65100;
        }

        .contact input,
        .contact textarea {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid gray;
        }

        .contact textarea {
            height: 100px;
        }

        .contact button {
            background-color: orange;
            color: white;
            border: none;
            padding: 10px 25px;
            cursor: pointer;
        }

        .footer {
            background-color: #102a43;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .footer h2 {
            color: #ffb703;
        }

        .footer p {
            margin: 8px;
        }

    </style>
</head>

<body>

   <body>

    <div class="header">

        <div class="logo">
            <img src="logo.png">
        </div>

        <h1>Indian Festival</h1>
        <p>Celebrate the Joy and Happiness</p>

    </div>

    <div class="nav">
        <a href="ff.html">Home</a>
        <a href="festivals.html">Festivals</a>
        <a href="about1.html">About</a>
        <a href="contact1.html">Contact</a>
    </div>


    <div class="contact">

        <h2>Contact Us</h2>

  <p>Email: indianfestivals@gmail.com</p>
        <p>Phone: +91 98765 43210</p>

        <p>We would love to hear from you!</p>

        <form>
            <input type="text" placeholder="Enter Your Name">

            <input type="email" placeholder="Enter Your Email">

            <textarea placeholder="Enter Your Message"></textarea>

            <br>

            <button type="submit">Send Message</button>
        </form>

     </div>

    <div class="footer">

        <h2>Indian Festivals</h2>

        <p>Celebrate • Explore • Know</p>

        <p>
            © 2026 Indian Festivals. All Rights Reserved.
        </p>

    </div>


</body>
</html>
